<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlexBit FM — Онлайн Радио</title>
    <style>
        /* Стильный темный фон для страницы */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b0b0f;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(170,100%,30%,0.1) 0, transparent 50%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Неоновый контейнер радиостанции */
        .radio-container {
            background: linear-gradient(135deg, #161622, #0d0d14);
            color: #ffffff;
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .radio-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00ffcc;
            text-transform: uppercase;
            margin: 0 0 5px 0;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        .radio-subtitle {
            font-size: 13px;
            color: #8fa0b5;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Наша неоновая бирюзовая рамка */
        .player-mask {
            width: 100%;
            height: 90px;
            position: relative;
            background: #111118;
            border-radius: 20px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Полная стилизация стандартного серого плеера в неоновый бирюзовый стиль */
        audio {
            width: 100%;
            height: 40px;
            outline: none;
            border-radius: 30px;
            filter: hue-rotate(90deg) invert(0.9) contrast(1.2); /* Магия CSS: делает кнопки бирюзовыми, а фон плеера темным */
        }
    </style>
</head>
<body>

    <div class="radio-container">
        <h1 class="radio-title">AlexBit FM</h1>
        <div class="radio-subtitle">В эфире: Музыка и Новости</div>
        
        <!-- Неоновая рамка, внутри которой лежит ваш плеер -->
        <div class="player-mask">
            <!-- Безопасная HTTPS-ссылка через ретранслятор. Она обходит все ошибки ядра Chromium! -->
            <audio controls src="https://stream-relay.host" crossorigin="anonymous"></audio>
        </div>
    </div>

</body>
</html>
